# Import .env file
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DB}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=1000000000

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# CORS configuration
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Google Cloud Storage
gcs.bucket-name=${GCS_BUCKET_NAME}
gcp.project-id=${GCP_PROJECT_ID}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:myelga_app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Application Notification Messaging
rabbitmq.notification.exchange=application.notification.exchange
rabbitmq.notification.queue=notification.email.queue
rabbitmq.notification.routing-key=application.status.changed
